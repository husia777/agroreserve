# ============================================================
# Docker Compose — Агрорезерв (development)
# Запуск: make docker-up  или  docker compose up -d
# ============================================================

services:
  # ── MongoDB ──────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: agroreserve-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: agroreserve
    volumes:
      - mongodb_data:/data/db
      - mongodb_backup:/data/backup
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: agroreserve-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────
  api:
    build: ./backend
    container_name: agroreserve-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/agroreserve
      - REDIS_URL=redis://redis:6379/0
      - ENV=development
      - DEBUG=true
    volumes:
      - ./app:/app/app:ro
      - uploads_data:/app/uploads
      - media_data:/app/media
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Worker ────────────────────────────────────────────
  celery-worker:
    build: ./backend
    container_name: agroreserve-celery
    restart: unless-stopped
    command: uv run celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/agroreserve
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/app/app:ro
      - uploads_data:/app/uploads
      - media_data:/app/media
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat (планировщик) ────────────────────────────────
  celery-beat:
    build: ./backend
    container_name: agroreserve-beat
    restart: unless-stopped
    command: uv run celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/agroreserve
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/app/app:ro
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mongodb_data:
  mongodb_backup:
  redis_data:
  uploads_data:
  media_data:
