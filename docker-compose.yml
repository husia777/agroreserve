
# ============================================================
# Docker Compose для проекта Агрорезерв
# Сервисы: FastAPI backend, MongoDB, Redis, Nginx
# ============================================================

services:
  # ── MongoDB — основная база данных ──────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: agroreserve_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-supersecret}
      MONGO_INITDB_DATABASE: agroreserve
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./backend/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    networks:
      - agroreserve_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis — брокер задач Celery и кэш ───────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: agroreserve_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - agroreserve_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agroreserve_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-supersecret}@mongodb:27017/agroreserve?authSource=admin
      - REDIS_URI=redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
    ports:
      - "8000:8000"
    networks:
      - agroreserve_net
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level info

  # ── Celery Worker — фоновые задачи ──────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agroreserve_celery
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-supersecret}@mongodb:27017/agroreserve?authSource=admin
      - REDIS_URI=redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    networks:
      - agroreserve_net
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 -Q default,notifications,sync

  # ── Celery Beat — планировщик задач ─────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agroreserve_celery_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-supersecret}@mongodb:27017/agroreserve?authSource=admin
      - REDIS_URI=redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
    volumes:
      - ./backend:/app
      - celerybeat_schedule:/tmp
    networks:
      - agroreserve_net
    depends_on:
      - celery_worker
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  # ── Nginx — reverse proxy ────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: agroreserve_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
      # SSL сертификаты (Let's Encrypt)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Статические файлы фронтенда (после сборки)
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - agroreserve_net
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

# ── Тома для хранения данных ─────────────────────────────────
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  nginx_logs:
    driver: local
  celerybeat_schedule:
    driver: local
  backend_backups:
    driver: local

# ── Сеть проекта ─────────────────────────────────────────────
networks:
  agroreserve_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
