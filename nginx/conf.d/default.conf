# ─── Виртуальный хост Агрорезерв (dev-режим) ───────────────
upstream backend_api {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost agroreserve.ru;

    # ── API Backend (проксирование) ──────────────────────────
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для длинных запросов
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # ── Health check ─────────────────────────────────────────
    location /health {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }

    # ── Swagger документация ─────────────────────────────────
    location /docs {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }

    # ── Загруженные файлы (сертификаты, документы) ────────────
    location /uploads/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }


    # ── Фото товаров и медиафайлы ────────────────────────────
    location /media/ {
        proxy_pass http://backend_api/media/;
        proxy_set_header Host $host;
    }

    # ── SEO: sitemap.xml и robots.txt ────────────────────────
    location = /sitemap.xml {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
    }

    location = /robots.txt {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_cache_valid 200 24h;
    }

    # ── Service Worker — без кеша (UC-45 PWA) ────────────────
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── manifest.json ─────────────────────────────────────────
    location = /manifest.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── PWA иконки ────────────────────────────────────────────
    location /icons/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── Статика фронтенда (SPA) ──────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
