pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: '*.{ts,tsx}'
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    - name: format
      glob: '*.{ts,tsx,css,json}'
      run: npx prettier --write {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: typecheck
      run: npm run typecheck
    - name: test
      run: npm run test
