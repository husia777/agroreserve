# ============================================================
# Проект Агрорезерв — Backend (FastAPI)
# Менеджер зависимостей: uv
# ============================================================

[project]
name = "agroreserve-backend"
version = "1.0.0"
description = "Backend API для оптовой торговли овощами и фруктами — Агрорезерв"
# readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # ── Web framework ─────────────────────────────────────────
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    # ── MongoDB ───────────────────────────────────────────────
    "pymongo==4.7.3",
    "motor==3.4.0",
    "beanie==1.26.0",
    # ── Pydantic (валидация данных) ───────────────────────────
    "pydantic[email]==2.7.1",
    "pydantic-settings==2.3.0",
    # ── Аутентификация и безопасность ─────────────────────────
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    # ── Celery (фоновые задачи) ───────────────────────────────
    "celery==5.4.0",
    "redis==5.0.4",
    "kombu==5.3.5",
    # ── HTTP клиент (для 1С OData, Telegram API) ──────────────
    "httpx==0.27.0",
    "aiohttp==3.9.5",
    # ── Генерация PDF (документы, ярлыки) ─────────────────────
    "weasyprint==62.3",
    "pydyf==0.11.0",
    "Jinja2==3.1.4",
    # ── Работа с файлами и изображениями ──────────────────────
    "aiofiles==23.2.1",
    "Pillow==10.3.0",
    "python-magic==0.4.27",
    # ── S3 / Яндекс.Облако (хранение файлов) ─────────────────
    "boto3==1.34.101",
    "botocore==1.34.101",
    # ── Утилиты ───────────────────────────────────────────────
    "python-slugify==8.0.4",
    "structlog==24.1.0",
    "orjson==3.10.3",
    # ── Экспорт Excel (P&L отчёты, UC-83) ────────────────────
    "openpyxl==3.1.2",
    "xlsxwriter==3.2.0",
]

[project.optional-dependencies]
dev = [
    # ── Тестирование ──────────────────────────────────────────
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "mongomock-motor==0.0.21",

    # ── Линтеры и форматтеры ──────────────────────────────────
    "ruff==0.4.4",
    "mypy==1.10.0",

    # ── Pre-commit ────────────────────────────────────────────
    "pre-commit==3.7.1",

    # ── Безопасность ──────────────────────────────────────────
    "bandit==1.7.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff (линтер + форматтер) ────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (запрет print())
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (закомментированный код)
    "S",    # bandit (безопасность)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "B905",   # zip strict
    "S101",   # assert used (ok in tests)
    "S104",   # binding to 0.0.0.0
    "S106",   # hardcoded password (false positives in models)
    "RET504", # unnecessary assignment before return
    "UP007",  # use X | Y instead of Union (pydantic v1 compat)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]
"app/tasks/**/*.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

# ── Pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ── MyPy ──────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "motor.*", "beanie.*", "weasyprint.*"]
ignore_missing_imports = true

# ── Coverage ──────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["app/tasks/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
fail_under = 30
show_missing = true

# ── Bandit ────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests"]
